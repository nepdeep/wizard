<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#7fd0ff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>The Little Weather Wizard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 6l12 28 30 3-23 20 7 30-26-16-26 16 7-30L8 37l30-3z' fill='%23ffd43b' stroke='%23f59f00' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
  :root {
    --btn: clamp(62px, min(19.5vw, 17vh), 116px);
    --small: calc(var(--btn) * 0.68);
    --gap: clamp(8px, 2.2vmin, 16px);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --ink: #4b3b5c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #8fd6ff;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    font-family: system-ui, sans-serif;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button {
    font: inherit; border: 0; padding: 0; cursor: pointer; touch-action: manipulation;
    -webkit-appearance: none; appearance: none;
  }
  button svg { width: 100%; height: 100%; display: block; pointer-events: none; }
  button:focus-visible { outline: 5px solid #fff; outline-offset: 3px; }

  /* ---------- weather picture buttons ---------- */
  #weather-bar {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--safe-b) + var(--gap));
    display: flex; gap: var(--gap); padding: calc(var(--gap) * 0.8);
    background: rgba(255, 255, 255, 0.42); border-radius: calc(var(--btn) * 0.42);
    box-shadow: 0 8px 24px rgba(60, 80, 140, 0.18), inset 0 2px 0 rgba(255,255,255,.7);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .wx {
    position: relative; width: var(--btn); height: var(--btn); border-radius: 30%;
    padding: calc(var(--btn) * 0.1);
    box-shadow: 0 6px 0 rgba(75, 59, 92, 0.22), 0 10px 18px rgba(60, 80, 140, 0.2), inset 0 3px 0 rgba(255,255,255,.75);
    transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s;
  }
  .wx[data-kind="sun"]  { background: linear-gradient(160deg, #fff6c9, #ffd27a); }
  .wx[data-kind="rain"] { background: linear-gradient(160deg, #e0f2ff, #8fcaff); }
  .wx[data-kind="wind"] { background: linear-gradient(160deg, #e3fbe6, #9be5ad); }
  .wx[data-kind="snow"] { background: linear-gradient(160deg, #f7f4ff, #cbb8ff); }
  .wx:active { transform: scale(.94); }
  .wx.selected {
    transform: translateY(-8%) scale(1.08);
    box-shadow: 0 0 0 5px #fff, 0 0 0 10px #ffd43b, 0 14px 24px rgba(60, 80, 140, 0.32);
  }
  .wx.selected svg { animation: wiggle 1.6s ease-in-out infinite; }
  .wx.hint::after {
    content: ""; position: absolute; inset: -9px; border-radius: 34%;
    border: 5px dashed #fff; animation: hint 1.4s ease-in-out infinite; pointer-events: none;
  }
  .wx.demo-press { transform: scale(.9) !important; filter: brightness(1.12); }
  @keyframes wiggle { 0%,100% { transform: rotate(0) scale(1); } 30% { transform: rotate(-6deg) scale(1.05); } 60% { transform: rotate(5deg) scale(1.03); } }
  @keyframes hint { 0%,100% { transform: scale(1); opacity: .95; } 50% { transform: scale(1.07); opacity: .45; } }

  /* ---------- corners ---------- */
  #top-left { position: fixed; top: calc(var(--safe-t) + var(--gap)); left: calc(var(--safe-l) + var(--gap)); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #top-right { position: fixed; top: calc(var(--safe-t) + var(--gap)); right: calc(var(--safe-r) + var(--gap)); display: flex; align-items: flex-start; gap: var(--gap); }
  .round {
    width: var(--small); height: var(--small); border-radius: 50%; padding: calc(var(--small) * 0.16);
    background: linear-gradient(160deg, #ffffff, #e6eeff);
    box-shadow: 0 5px 0 rgba(75,59,92,.2), 0 8px 16px rgba(60,80,140,.18), inset 0 2px 0 #fff;
    transition: transform .2s cubic-bezier(.34,1.56,.64,1);
  }
  .round:active { transform: scale(.92); }
  .round[aria-pressed="true"] { background: linear-gradient(160deg, #fff7d6, #ffe08a); box-shadow: 0 0 0 4px #fff, 0 0 0 8px #ffc94d, 0 8px 16px rgba(60,80,140,.18); }
  #reset {
    width: var(--btn); height: var(--btn); padding: calc(var(--btn) * 0.1);
    background: linear-gradient(160deg, #ffe3f1, #ffa8cf);
  }
  #reset.spin svg { animation: spin .8s cubic-bezier(.34,1.3,.64,1); }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(-360deg); } }

  #wish {
    position: relative; width: calc(var(--btn) * 1.05); height: calc(var(--btn) * 1.05); border-radius: 50%;
    padding: calc(var(--btn) * 0.13);
    background: radial-gradient(circle at 35% 30%, #ffffff, #fff4c2 70%, #ffe27a);
    box-shadow: 0 0 0 5px #fff, 0 8px 20px rgba(255, 170, 0, .35);
    animation: float 3.2s ease-in-out infinite;
  }
  #wish.pop { animation: pop .6s cubic-bezier(.34,1.56,.64,1); }
  #wish .sparkle { position: absolute; width: 30%; height: 30%; right: -8%; top: -8%; animation: twinkle 1.6s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes pop { 0% { transform: scale(.4); } 100% { transform: scale(1); } }
  @keyframes twinkle { 0%,100% { transform: scale(.7) rotate(0); opacity: .6; } 50% { transform: scale(1.1) rotate(25deg); opacity: 1; } }
  #pips { display: flex; gap: 5px; }
  .pip {
    position: relative; width: calc(var(--btn) * 0.34); height: calc(var(--btn) * 0.34); border-radius: 50%;
    background: rgba(255,255,255,.72); padding: 3px; box-shadow: 0 3px 8px rgba(60,80,140,.18);
    transition: transform .3s cubic-bezier(.34,1.56,.64,1), background .3s;
  }
  .pip svg { width: 100%; height: 100%; display: block; filter: grayscale(1) opacity(.45); transition: filter .3s; }
  .pip.now { transform: scale(1.18); background: #fff; }
  .pip.now svg { filter: none; }
  .pip.done { background: #ffe066; transform: scale(1.08); }
  .pip.done svg { filter: none; }
  .pip .star { position: absolute; right: -22%; bottom: -22%; width: 58%; height: 58%; display: none; }
  .pip.done .star { display: block; animation: pop .5s cubic-bezier(.34,1.56,.64,1); }

  /* ---------- helper hand + fx ---------- */
  #hand {
    position: fixed; left: 0; top: 0; width: 96px; height: 116px; pointer-events: none; opacity: 0;
    filter: drop-shadow(0 6px 8px rgba(40, 30, 80, .3)); z-index: 20; will-change: transform, opacity;
  }
  #hand svg { width: 100%; height: 100%; display: block; transform-origin: 33% 4%; transition: transform .16s; }
  #hand.press svg { transform: scale(.82) rotate(-6deg); }
  .tap-ring {
    position: fixed; width: 80px; height: 80px; margin: -40px 0 0 -40px; border-radius: 50%;
    border: 6px solid #fff; pointer-events: none; z-index: 19; animation: ring .7s ease-out forwards;
  }
  @keyframes ring { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
  .fly-star { position: fixed; left: 0; top: 0; width: 64px; height: 64px; margin: -32px 0 0 -32px; pointer-events: none; z-index: 21; }

  #flash { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle, rgba(255,255,255,.85), rgba(255,240,255,0) 70%); opacity: 0; z-index: 5; }
  #flash.on { animation: flash 0.9s ease-out; }
  @keyframes flash { 0% { opacity: 0; } 25% { opacity: .9; } 100% { opacity: 0; } }

  #nogl { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; color: var(--ink); font-size: 18px; background: #bfe9ff; }

  body.calm .wx.selected svg, body.calm #wish, body.calm #wish .sparkle { animation: none; }
  body.calm .wx.hint::after { animation: none; opacity: .9; }
  /* short landscape phones: picture buttons become a column on the right */
  @media (orientation: landscape) and (max-height: 520px) {
    :root { --btn: clamp(56px, 18vh, 90px); }
    #weather-bar {
      left: auto; top: 50%; bottom: auto; right: calc(var(--safe-r) + var(--gap));
      transform: translateY(-50%); flex-direction: column;
    }
    #top-right { top: auto; right: auto; bottom: calc(var(--safe-b) + var(--gap)); left: calc(var(--safe-l) + var(--gap)); align-items: flex-end; }
    #reset { order: -1; }
    .wx.selected { transform: translateX(-12%) scale(1.04); }
  }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" } }</script>

<body>
<canvas id="scene" aria-label="A tiny magical island"></canvas>
<div id="flash"></div>

<div id="top-left">
  <button id="wish" aria-label="Show me the wish"></button>
  <div id="pips"></div>
</div>
<div id="top-right">
  <button id="sound" class="round" aria-label="Sound" aria-pressed="false"></button>
  <button id="motion" class="round" aria-label="Calm motion" aria-pressed="false"></button>
  <button id="reset" class="round" aria-label="Reset island"></button>
</div>
<div id="weather-bar" role="toolbar" aria-label="Weather">
  <button class="wx" data-kind="sun" aria-label="Sunshine"></button>
  <button class="wx" data-kind="rain" aria-label="Gentle rain"></button>
  <button class="wx" data-kind="wind" aria-label="Soft breeze"></button>
  <button class="wx" data-kind="snow" aria-label="Snow"></button>
</div>
<div id="hand" aria-hidden="true"></div>
<div id="nogl">This little island needs WebGL. Please try a newer browser.</div>

<script type="module">
import * as THREE from 'three';

/* =====================================================================
   The Little Weather Wizard
   A gentle, wordless weather toy. Everything is procedural.
   ===================================================================== */

// ---------- small helpers ----------
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const easeOutBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const distXZ = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);

const store = {
  get(k, d) { try { const v = localStorage.getItem('lww-' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('lww-' + k, JSON.stringify(v)); } catch { /* private mode */ } },
};

const prefersReduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const settings = { muted: store.get('muted', false), calm: store.get('calm', prefersReduced) };
let MOTION = settings.calm ? 0.35 : 1;          // scales idle motion + particle counts
const amount = (n) => Math.max(1, Math.round(n * (settings.calm ? 0.45 : 1)));

/** Critically-damped-ish spring used for bouncy "pop" animations. */
class Spring {
  constructor(v = 0) { this.v = v; this.t = v; this.vel = 0; }
  update(dt, k = 120, d = 12) { const a = (this.t - this.v) * k - this.vel * d; this.vel += a * dt; this.v += this.vel * dt; return this.v; }
  set(v) { this.v = this.t = v; this.vel = 0; }
}

// ---------- renderer / scene / camera ----------
const canvas = document.getElementById('scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  document.getElementById('nogl').style.display = 'grid';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 400);
const camTarget = V3(0, 0.4, 0);
const FACE_REF = V3(0, 0, 18); // characters turn toward the viewer

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}

scene.background = canvasTex(4, 512, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#55bdfc'); gr.addColorStop(0.45, '#a6e0ff'); gr.addColorStop(0.8, '#e8f7ff'); gr.addColorStop(1, '#fff1d0');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});

scene.add(new THREE.HemisphereLight('#e4f5ff', '#9adf7a', 1.55));
const sunLight = new THREE.DirectionalLight('#fff3da', 2.3);
sunLight.position.set(7, 15, 9);
sunLight.castShadow = true;
const smallScreen = Math.min(innerWidth, innerHeight) < 700;
sunLight.shadow.mapSize.set(smallScreen ? 1024 : 2048, smallScreen ? 1024 : 2048);
Object.assign(sunLight.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 2, far: 40 });
sunLight.shadow.radius = 5;
sunLight.shadow.bias = -0.0006;
sunLight.shadow.normalBias = 0.03;
scene.add(sunLight, sunLight.target);
const fillLight = new THREE.DirectionalLight('#ffe0f2', 0.55);
fillLight.position.set(-9, 6, 6);
scene.add(fillLight);

// ---------- shared geometry + materials ----------
const SPHERE = new THREE.SphereGeometry(1, 28, 20);
const SPHERE_MID = new THREE.SphereGeometry(1, 16, 12);
const SPHERE_LO = new THREE.SphereGeometry(1, 10, 8);
const HEMI = new THREE.SphereGeometry(1, 28, 14, 0, TAU, 0, Math.PI / 2);
const matCache = new Map();
function std(color, extra) {
  if (!extra && matCache.has(color)) return matCache.get(color);
  const m = new THREE.MeshStandardMaterial({ color, roughness: 0.72, metalness: 0, ...(extra || {}) });
  if (!extra) matCache.set(color, m);
  return m;
}
const INVISIBLE = new THREE.MeshBasicMaterial({ visible: false });
function mesh(geo, mat, { cast = true, receive = false } = {}) {
  const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = receive; return m;
}
function ball(color, sx, sy = sx, sz = sx, opts) {
  const big = Math.max(sx, sy, sz);
  const m = mesh(big > 0.3 ? SPHERE : big > 0.08 ? SPHERE_MID : SPHERE_LO, typeof color === 'string' ? std(color) : color, opts || { cast: big > 0.12 });
  m.scale.set(sx, sy, sz); return m;
}
/** scale a pop-in part, hiding it completely while it is (almost) gone */
function popScale(o, v, base = 1) { o.scale.setScalar(Math.max(0.001, v) * base); o.visible = v > 0.02; }
const SNOW_MAT = std('#ffffff', { roughness: 0.95, emissive: '#dfe9ff', emissiveIntensity: 0.25 });
const EYE_MAT = std('#2f2238', { roughness: 0.3 });
const GLINT_MAT = new THREE.MeshBasicMaterial({ color: '#ffffff' });
const CHEEK_MAT = new THREE.MeshBasicMaterial({ color: '#ff9fbf', transparent: true, opacity: 0.75 });

function eye(parent, x, y, z, r = 0.05) {
  const e = ball(EYE_MAT, r, r * 1.2, r * 0.7, { cast: false }); e.position.set(x, y, z); parent.add(e);
  const g = mesh(SPHERE_LO, GLINT_MAT, { cast: false }); g.scale.setScalar(r * 0.35); g.position.set(x + r * 0.3, y + r * 0.45, z + r * 0.6); parent.add(g);
  return e;
}
function cheek(parent, x, y, z, r = 0.06) {
  const c = mesh(SPHERE_LO, CHEEK_MAT, { cast: false }); c.scale.set(r, r * 0.6, r * 0.3); c.position.set(x, y, z); parent.add(c); return c;
}
function faceCamera(obj, x, z) { obj.rotation.y = Math.atan2(FACE_REF.x - x, FACE_REF.z - z); }

// ---------- painted faces (canvas textures) ----------
const faceCache = new Map();
function faceTex(kind) {
  if (faceCache.has(kind)) return faceCache.get(kind);
  const t = canvasTex(256, 256, (g) => {
    const ink = '#3a2733';
    g.lineCap = 'round'; g.lineJoin = 'round';
    // cheeks
    g.fillStyle = 'rgba(255,120,160,0.55)';
    for (const x of [58, 198]) { g.beginPath(); g.ellipse(x, 152, 24, 15, 0, 0, TAU); g.fill(); }
    g.strokeStyle = ink; g.fillStyle = ink; g.lineWidth = 9;
    const eyes = { sleepy: 'down', yawn: 'down', happy: 'open', awake: 'open', cozy: 'up', cloud: 'up', sun: 'open' }[kind];
    for (const x of [88, 168]) {
      g.beginPath();
      if (eyes === 'open') {
        g.ellipse(x, 108, 17, 23, 0, 0, TAU); g.fill();
        g.fillStyle = '#fff'; g.beginPath(); g.arc(x + 6, 99, 7, 0, TAU); g.fill(); g.fillStyle = ink;
      } else if (eyes === 'down') { g.arc(x, 100, 17, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke(); }
      else { g.arc(x, 118, 17, 1.15 * Math.PI, 1.85 * Math.PI); g.stroke(); }
    }
    g.beginPath();
    if (kind === 'yawn') { g.ellipse(128, 168, 13, 17, 0, 0, TAU); g.fill(); }
    else if (kind === 'happy' || kind === 'sun') {
      g.fillStyle = '#7a2f45'; g.beginPath(); g.moveTo(92, 146); g.quadraticCurveTo(128, 205, 164, 146); g.closePath(); g.fill();
      g.fillStyle = '#ff8fa8'; g.beginPath(); g.ellipse(128, 174, 15, 9, 0, 0, TAU); g.fill();
    } else { g.arc(128, 138, 26, 0.2 * Math.PI, 0.8 * Math.PI); g.stroke(); }
  });
  faceCache.set(kind, t);
  return t;
}

// ---------- sprite particle textures ----------
const TEX = {
  soft: canvasTex(64, 64, (g) => {
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(255,255,255,.7)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  }),
  drop: canvasTex(32, 64, (g) => {
    g.fillStyle = '#8fd3ff'; g.beginPath(); g.moveTo(16, 2);
    g.bezierCurveTo(30, 30, 30, 60, 16, 60); g.bezierCurveTo(2, 60, 2, 30, 16, 2); g.fill();
    g.fillStyle = 'rgba(255,255,255,.85)'; g.beginPath(); g.ellipse(12, 42, 3, 7, 0.2, 0, TAU); g.fill();
  }),
  flake: canvasTex(64, 64, (g) => {
    g.translate(32, 32); g.strokeStyle = '#fff'; g.lineWidth = 5; g.lineCap = 'round';
    g.shadowColor = 'rgba(140,170,255,.9)'; g.shadowBlur = 4;
    for (let i = 0; i < 6; i++) {
      g.rotate(Math.PI / 3); g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -24);
      g.moveTo(0, -14); g.lineTo(-7, -20); g.moveTo(0, -14); g.lineTo(7, -20); g.stroke();
    }
  }),
  leaf: canvasTex(64, 64, (g) => {
    g.translate(32, 32); g.rotate(-0.6); g.fillStyle = '#fff';
    g.beginPath(); g.moveTo(0, -26); g.quadraticCurveTo(22, 0, 0, 26); g.quadraticCurveTo(-22, 0, 0, -26); g.fill();
    g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 3; g.beginPath(); g.moveTo(0, -20); g.lineTo(0, 24); g.stroke();
  }),
  heart: canvasTex(64, 64, (g) => {
    g.fillStyle = '#ff6fa3'; g.beginPath(); g.moveTo(32, 54);
    g.bezierCurveTo(4, 36, 6, 10, 22, 10); g.bezierCurveTo(28, 10, 32, 16, 32, 20);
    g.bezierCurveTo(32, 16, 36, 10, 42, 10); g.bezierCurveTo(58, 10, 60, 36, 32, 54); g.fill();
    g.fillStyle = 'rgba(255,255,255,.7)'; g.beginPath(); g.ellipse(20, 22, 5, 7, -0.5, 0, TAU); g.fill();
  }),
  note: canvasTex(64, 64, (g) => {
    g.fillStyle = '#8a63ff'; g.strokeStyle = '#8a63ff'; g.lineWidth = 6;
    g.beginPath(); g.ellipse(22, 48, 10, 8, -0.4, 0, TAU); g.fill();
    g.beginPath(); g.moveTo(30, 46); g.lineTo(30, 10); g.quadraticCurveTo(44, 14, 50, 26); g.stroke();
  }),
  z: canvasTex(64, 64, (g) => {
    g.strokeStyle = '#9db2ff'; g.lineWidth = 8; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(16, 16); g.lineTo(48, 16); g.lineTo(16, 48); g.lineTo(48, 48); g.stroke();
  }),
  confetti: canvasTex(32, 32, (g) => { g.fillStyle = '#fff'; g.beginPath(); g.roundRect(6, 10, 20, 12, 4); g.fill(); }),
};
// soft 4-point star
TEX.sparkle = canvasTex(64, 64, (g) => {
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 22);
  gr.addColorStop(0, 'rgba(255,255,255,.95)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  g.fillStyle = '#fff'; g.beginPath(); g.moveTo(32, 1);
  g.quadraticCurveTo(36, 28, 63, 32); g.quadraticCurveTo(36, 36, 32, 63);
  g.quadraticCurveTo(28, 36, 1, 32); g.quadraticCurveTo(28, 28, 32, 1); g.fill();
});

// ---------- particles ----------
const ADDITIVE = new Set(['soft', 'sparkle']);
const particles = {
  list: [], pool: new Map(),
  spawn(type, o) {
    if (this.list.length > 650) return null;

    let s = arr.pop();
    if (!s) {
      s = new THREE.Sprite(new THREE.SpriteMaterial({
        map: TEX[type], transparent: true, depthWrite: false,
        blending: ADDITIVE.has(type) ? THREE.AdditiveBlending : THREE.NormalBlending,
      }));
      s.userData.type = type;
    }
    s.position.copy(o.pos);
    s.material.color.set(o.color || '#ffffff');
    s.material.rotation = o.rot ?? rand(0, TAU);
    const p = {
      s, vel: o.vel ? o.vel.clone() : V3(), life: o.life ?? 1, max: o.life ?? 1,
      size0: o.size ?? 0.3, size1: o.sizeEnd ?? o.size ?? 0.3, aspect: o.aspect ?? 1,
      grav: o.grav ?? 0, drag: o.drag ?? 0, spin: o.spin ?? 0, sway: o.sway ?? 0, ph: rand(0, TAU),
      ground: o.ground ?? null, onGround: o.onGround, settle: o.settle, alpha: o.alpha ?? 1, fadeIn: o.fadeIn ?? 0.12,

  update(dt, t) {

      p.vel.y -= p.grav * dt;
      if (p.drag) p.vel.multiplyScalar(Math.max(0, 1 - p.drag * dt));
      s.position.addScaledVector(p.vel, dt);
      if (p.sway) { s.position.x += Math.sin(t * 2.2 + p.ph) * p.sway * dt; s.position.z += Math.cos(t * 1.7 + p.ph) * p.sway * 0.5 * dt; }

      const k = 1 - p.life / p.max;

      s.material.opacity = p.alpha * Math.min(1, k / p.fadeIn) * Math.min(1, p.life / Math.min(0.5, p.max * 0.4));

    }
  },
  kill(i) {

    this.pool.get(p.s.userData.type).push(p.s);
    this.list[i] = this.list[this.list.length - 1]; this.list.pop();

  for (let i = 0; i < puffs; i++) {

  }

}

function blobGeo(r, seed) {
  const s = new THREE.Shape(); const n = 28;
  for (let i = 0; i <= n; i++) {
    const a = i / n * TAU; const rr = r * (1 + 0.13 * Math.sin(a * 3 + seed) + 0.07 * Math.sin(a * 5 + seed * 2.3));
    const x = Math.cos(a) * rr, y = Math.sin(a) * rr; i ? s.lineTo(x, y) : s.moveTo(x, y);
  }
  return new THREE.ShapeGeometry(s, 4).rotateX(-Math.PI / 2);
}

function nearestPatch(kind, c, within) {

  for (const p of patches) if (p.kind === kind && !p.dying) { const d = distXZ(p.mesh.position, c); if (d < bd) { bd = d; best = p; } }
  return best;
}
function addPatch(kind, c) {
  let p = nearestPatch(kind, c, 1.3);
  if (!p && patches.filter((q) => q.kind === kind && !q.dying).length >= 8) p = nearestPatch(kind, c, 99);
  if (p) { p.spring.t = Math.min(1.35, p.spring.t + 0.3); return p; }
  const isP = kind === 'puddle';
  const mat = isP
    ? std('#66ccff', { roughness: 0.06, metalness: 0.2, transparent: true, opacity: 0.88, emissive: '#2b9be0', emissiveIntensity: 0.15, polygonOffset: true, polygonOffsetFactor: -1 })

  const m = mesh(blobGeo(isP ? 0.85 : 0.95, rand(0, 9)), mat, { cast: false, receive: true });
  m.position.set(c.x, (isP ? 0.014 : 0.01) + patches.length * 0.0004, c.z); m.rotation.y = rand(0, TAU); m.scale.setScalar(0.001);
  scene.add(m);
  p = { kind, mesh: m, spring: new Spring(0), sparkle: 0, dying: false };
  p.spring.t = 0.75; patches.push(p);
  return p;
}
function shrinkPatches(kind, c, r, amountDown) {
  let any = false;
  for (const p of patches) {
    if (p.kind !== kind || p.dying || distXZ(p.mesh.position, c) > r + 0.6) continue;
    any = true; p.spring.t -= amountDown;
    if (kind === 'puddle') p.sparkle = 2.2;
    if (p.spring.t < 0.2) { p.spring.t = 0; p.dying = true; }

}

const REACH = 1.9;
/** how high the little weather should float so tall things don't hide it */
function skyHeight(c) {
  if (distXZ(c, P.tree) < 2.2) return 5.6;

  return 3.4;
}
let selected = store.get('kind', 'rain');
function applyWeather(kind, c, direct = null) {
  c = V3(c.x, 0, c.z);
  const r = Math.hypot(c.x, c.z); if (r > 6.3) c.multiplyScalar(6.3 / r);
  if (casters.length > 6) { const old = casters.shift(); old.dispose(); }
  casters.push(kind === 'sun' ? makeSunCaster(c) : kind === 'wind' ? makeWindCaster(c) : makeCloudCaster(c, kind));
  wand.setTarget(c); wand.swish();
  sparkleBurst(wand.tip(), 8, WX_COLORS[kind], 0.6, 0.6);
  audio.weather(kind);

  const affected = new Set();
  if (direct) affected.add(direct);
  for (const it of interactables) {
    const p = it.center ? it.center() : it.pos;
    const extra = it === pond ? POND_R - 0.4 : it === tree ? 0.5 : 0;
    if (distXZ(p, c) <= REACH + extra) affected.add(it);
  }
  for (const it of affected) it.weather(kind, c);

  // what happens to the ground itself
  const onPond = pond.contains(c, 0.25);
  if (kind === 'rain') {
    shrinkPatches('snow', c, REACH, 0.35);
    if (!onPond) addPatch('puddle', c);
  } else if (kind === 'snow') {
    if (!onPond && distXZ(c, P.snow) > 1.0) addPatch('snow', c);
  } else if (kind === 'sun') {
    shrinkPatches('puddle', c, REACH, 0.32);
    shrinkPatches('snow', c, REACH, 0.5);
    const busy = [...affected].some((a) => a !== bunny);
    if (!busy && !onPond && butterflies.length < (settings.calm ? 3 : 6)) {
      for (let i = 0; i < (settings.calm ? 1 : 2); i++) butterflies.push(new Butterfly(V3(c.x + rand(-0.4, 0.4), 0, c.z + rand(-0.4, 0.4))));
    }
  } else if (kind === 'wind') {
    for (const p of patches) if (p.kind === 'puddle' && distXZ(p.mesh.position, c) < REACH + 0.5) for (let i = 0; i < 3; i++) ripples.add(p.mesh.position.x + rand(-0.4, 0.4), 0.03, p.mesh.position.z + rand(-0.4, 0.4), 0.5, 0.9);
    for (const b of butterflies) b.home.x += 1.2;
  }
  wishes.onWeather(kind, affected);
  lastActivity = performance.now();
  lastWeather = { kind, at: [+c.x.toFixed(2), +c.z.toFixed(2)], direct: direct?.kind ?? null, affected: [...affected].map((a) => a.kind) };
}

const NOTES = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98, 1760];
const audio = {
  ctx: null, master: null, muted: settings.muted, noiseBuf: null,
  ensure() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 0.5;
    const comp = this.ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 4;
    this.master.connect(comp); comp.connect(this.ctx.destination);
    const len = this.ctx.sampleRate * 2; this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  },
  setMuted(m) { this.muted = m; if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.5, this.ctx.currentTime, 0.05); },
  ok() { return this.ctx && !this.muted && this.ctx.state === 'running'; },
  tone(freq, { t = 0, dur = 0.4, type = 'sine', vol = 0.12, attack = 0.01, slide = null, bell = true } = {}) {
    if (!this.ok()) return;
    const c = this.ctx, now = c.currentTime + t;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, now);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, now + dur * 0.8);
    g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(vol, now + attack); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g); g.connect(this.master); o.start(now); o.stop(now + dur + 0.05);
    if (bell && type === 'sine') {
      const o2 = c.createOscillator(), g2 = c.createGain(); o2.frequency.value = freq * 2.01;
      g2.gain.setValueAtTime(0.0001, now); g2.gain.exponentialRampToValueAtTime(vol * 0.25, now + attack); g2.gain.exponentialRampToValueAtTime(0.0001, now + dur * 0.5);
      o2.connect(g2); g2.connect(this.master); o2.start(now); o2.stop(now + dur);
    }
  },
  noise({ t = 0, dur = 1, vol = 0.08, type = 'lowpass', f0 = 800, f1 = null, q = 0.7, attack = 0.2 } = {}) {
    if (!this.ok()) return;
    const c = this.ctx, now = c.currentTime + t;
    const src = c.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const f = c.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, now);
    if (f1) { f.frequency.linearRampToValueAtTime(f1, now + dur * 0.5); f.frequency.linearRampToValueAtTime(f0, now + dur); }
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, now); g.gain.linearRampToValueAtTime(vol, now + attack); g.gain.linearRampToValueAtTime(0.0001, now + dur);
    src.connect(f); f.connect(g); g.connect(this.master); src.start(now, Math.random()); src.stop(now + dur + 0.05);
  },
  select(kind) { const base = { sun: 0, rain: 1, wind: 2, snow: 4 }[kind]; this.tone(NOTES[base + 2], { dur: 0.18, vol: 0.09 }); this.tone(NOTES[base + 4], { t: 0.07, dur: 0.25, vol: 0.08 }); },
  weather(kind) {
    if (kind === 'sun') { [0, 2, 4, 5].forEach((n, i) => this.tone(NOTES[n], { t: i * 0.08, dur: 0.9, vol: 0.07 })); this.tone(261.6, { dur: 1.4, vol: 0.04, attack: 0.25, bell: false }); }
    else if (kind === 'rain') { this.noise({ dur: 1.8, vol: 0.035, type: 'highpass', f0: 2500, attack: 0.3 }); for (let i = 0; i < 16; i++) this.tone(rand(1700, 3000), { t: rand(0, 1.6), dur: 0.06, vol: 0.025, bell: false }); }
    else if (kind === 'wind') { this.noise({ dur: 1.6, vol: 0.09, type: 'bandpass', f0: 350, f1: 1100, q: 1.2, attack: 0.5 }); }
    else if (kind === 'snow') { for (let i = 0; i < 8; i++) this.tone(NOTES[5 + ((Math.random() * 5) | 0)], { t: i * 0.18 + rand(0, 0.08), dur: 0.7, vol: 0.04 }); }
  },
  grow(n) { this.tone(NOTES[n + 1], { dur: 0.25, vol: 0.07, slide: NOTES[n + 3] }); },
  bloom() { [4, 5, 7].forEach((n, i) => this.tone(NOTES[n], { t: 0.1 + i * 0.07, dur: 0.6, vol: 0.06 })); },
  pop(n = 0) { this.tone(NOTES[(n % 5) + 2], { dur: 0.16, vol: 0.08, slide: NOTES[(n % 5) + 4] }); },
  melt() { this.tone(NOTES[6], { dur: 0.35, vol: 0.05, slide: NOTES[3] }); },
  whirr() { for (let i = 0; i < 6; i++) this.tone(900 + i * 60, { t: i * 0.07, dur: 0.08, vol: 0.025, type: 'triangle' }); },
  boing() { this.tone(420, { dur: 0.18, vol: 0.05, slide: 760, bell: false }); },
  quack() { this.tone(560, { dur: 0.13, vol: 0.05, type: 'triangle', slide: 380 }); this.tone(540, { t: 0.17, dur: 0.12, vol: 0.04, type: 'triangle', slide: 360 }); },
  bird() { for (let i = 0; i < 3; i++) this.tone(2200 + i * 180, { t: i * 0.11, dur: 0.09, vol: 0.035, slide: 2900 + i * 150, bell: false }); },
  wish() { [0, 2, 4, 5, 7].forEach((n, i) => this.tone(NOTES[n], { t: i * 0.07, dur: 0.7, vol: 0.07 })); },
  picnic() { const m = [0, 2, 4, 2, 4, 5, 7, 9]; m.forEach((n, i) => this.tone(NOTES[n], { t: 0.2 + i * 0.16, dur: 0.5, vol: 0.07 })); this.tone(261.6, { t: 0.2, dur: 1.6, vol: 0.04, attack: 0.3, bell: false }); },
  reset() { this.noise({ dur: 0.9, vol: 0.06, type: 'bandpass', f0: 600, f1: 2400, q: 1, attack: 0.2 }); [7, 5, 4, 2, 0].forEach((n, i) => this.tone(NOTES[n], { t: 0.1 + i * 0.07, dur: 0.5, vol: 0.05 })); },
};

function toScreen(v) {
  const p = v.clone().project(camera);
  return { x: (p.x + 1) / 2 * innerWidth, y: (1 - p.y) / 2 * innerHeight };
}

// ---------- the helper hand that demonstrates a wish ----------
const hand = (() => {
  const el = document.getElementById('hand'); el.innerHTML = ICONS.hand;
  const TIP = { x: 32, y: 4 };
  let token = 0, cur = { x: innerWidth * 0.7, y: innerHeight + 140 };
  const place = (x, y, o = 1) => { el.style.transform = `translate(${x - TIP.x}px, ${y - TIP.y}px)`; el.style.opacity = o; };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  async function moveTo(x, y, ms, my) {
    const from = { ...cur }; const start = performance.now();
    while (true) {
      if (my !== token) return false;
      const k = Math.min(1, (performance.now() - start) / ms); const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      cur = { x: lerp(from.x, x, e), y: lerp(from.y, y, e) - Math.sin(e * Math.PI) * 40 };
      place(cur.x, cur.y); if (k >= 1) return true;
      await new Promise(requestAnimationFrame);
    }
  }
  function ring(x, y) { const r = document.createElement('div'); r.className = 'tap-ring'; r.style.left = x + 'px'; r.style.top = y + 'px'; document.body.appendChild(r); setTimeout(() => r.remove(), 750); }
  async function press(my, x, y, btn) {
    el.classList.add('press'); btn?.classList.add('demo-press'); ring(x, y);
    await wait(260); el.classList.remove('press'); btn?.classList.remove('demo-press');
    return my === token;
  }
  return {
    async play(i) {
      const my = ++token; wishes.demos++;
      cur = { x: innerWidth * 0.75, y: innerHeight + 140 }; place(cur.x, cur.y, 0);
      el.style.transition = 'opacity .3s'; el.style.opacity = 1;
      for (let loop = 0; loop < 2; loop++) {
        const btn = ui.button(WISH_KIND[i]); const r = btn.getBoundingClientRect();
        const bx = r.left + r.width / 2, by = r.top + r.height / 2;
        if (!(await moveTo(bx, by, 900, my))) return;
        if (!(await press(my, bx, by, btn))) return;
        await wait(250);
        const tg = wishes.target(i); const s = toScreen(tg.focus());
        if (!(await moveTo(s.x, s.y, 1000, my))) return;
        if (!(await press(my, s.x, s.y))) return;
        await wait(650); if (my !== token) return;
      }
      el.style.opacity = 0;
    },
    cancel() { token++; el.style.transition = 'none'; el.style.opacity = 0; el.classList.remove('press'); },
  };
})();

// =====================================================================
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const groundPlane = new THREE.Plane(V3(0, 1, 0), 0);
function pickAt(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(hitMeshes, false);
  for (const h of hits) {
    const it = h.object.userData.inter;
    if (it && it !== pond) { const c = it.center ? it.center() : it.pos; return { point: V3(c.x, 0, c.z), inter: it }; }
    if (it === pond) return { point: V3(h.point.x, 0, h.point.z), inter: pond };
  }
  const p = V3();
  if (!raycaster.ray.intersectPlane(groundPlane, p)) { p.copy(raycaster.ray.direction).setY(0).normalize().multiplyScalar(6); }
  const len = Math.hypot(p.x, p.z); if (len > 6.3) p.multiplyScalar(6.3 / len);
  return { point: V3(p.x, 0, p.z), inter: null };
}
let activePointer = null, lastApply = { p: V3(), time: 0 };
canvas.addEventListener('pointerdown', (e) => {
  if (!e.isPrimary || activePointer !== null) return;
  activePointer = e.pointerId; try { canvas.setPointerCapture(e.pointerId); } catch { /* ignore */ }
  audio.ensure(); hand.cancel();
  const hit = pickAt(e.clientX, e.clientY);
  applyWeather(selected, hit.point, hit.inter);
  lastApply = { p: hit.point.clone(), time: performance.now() };
});
canvas.addEventListener('pointermove', (e) => {
  if (!e.isPrimary) return;
  const hit = pickAt(e.clientX, e.clientY);
  wand.setTarget(hit.point);
  if (activePointer === e.pointerId && distXZ(hit.point, lastApply.p) > 1.7 && performance.now() - lastApply.time > 420) {
    applyWeather(selected, hit.point, null);
    lastApply = { p: hit.point.clone(), time: performance.now() };
  }
});
const endPointer = (e) => { if (e.pointerId === activePointer) activePointer = null; };
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());
document.addEventListener('pointerdown', (e) => { if (e.target !== canvas && !e.target.closest('#wish')) hand.cancel(); }, true);
for (const ev of ['touchend', 'click']) document.addEventListener(ev, () => audio.ensure(), { passive: true });
document.addEventListener('visibilitychange', () => { if (!audio.ctx) return; document.hidden ? audio.ctx.suspend() : audio.ctx.resume(); });

// =====================================================================
//  RESET
// =====================================================================
function resetIsland() {
  audio.reset();
  for (const it of interactables) it.reset();
  for (const p of patches) { p.spring.t = 0; p.dying = true; }
  for (const b of butterflies) b.leave();
  picnic.reset();
  if (wishes.index === 0 && wishes.flower) wishes.flower.bloomT = Math.min(wishes.flower.bloomT, 0.12);
  // a sweep of sparkles across the island
  for (let i = 0; i < amount(60); i++) {
    const a = rand(0, TAU), r = Math.sqrt(Math.random()) * 6.2;
    particles.spawn('sparkle', { pos: V3(Math.cos(a) * r, rand(0.1, 0.5), Math.sin(a) * r), vel: V3(0, rand(0.8, 2), 0), drag: 1, life: rand(0.8, 1.6), size: rand(0.25, 0.5), sizeEnd: 0.05, color: pick(['#fff3a3', '#ffc9de', '#c5f6fa']), spin: 3 });
  }
  document.getElementById('flash').classList.remove('on'); void document.body.offsetWidth; document.getElementById('flash').classList.add('on');
  lastActivity = performance.now();
}

// =====================================================================
//  FIXED CAMERA THAT FITS ANY SCREEN (and avoids the picture buttons)
// =====================================================================
function uiRects() {
  return ['#top-left', '#top-right', '#weather-bar'].map((s) => document.querySelector(s).getBoundingClientRect())
    .map((r) => ({ left: r.left - 6, right: r.right + 6, top: r.top - 6, bottom: r.bottom + 6 }));
}
function fitCamera() {
  const W = innerWidth, H = innerHeight;
  renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.clearViewOffset();
  const portrait = camera.aspect < 0.85;
  camera.fov = portrait ? 42 : 34; camera.updateProjectionMatrix();
  const elev = THREE.MathUtils.degToRad(portrait ? 47 : 37);
  const dir = V3(0, Math.sin(elev), Math.cos(elev));
  const rects = uiRects(); const m = 4; const tmp = V3();
  const project = (d) => {
    camera.position.copy(camTarget).addScaledVector(dir, d); camera.lookAt(camTarget); camera.updateMatrixWorld(true);
    return fitPoints.map((p) => { tmp.copy(p.v).project(camera); return { x: (tmp.x + 1) / 2 * W, y: (1 - tmp.y) / 2 * H, so: p.screenOnly }; });
  };
  const ok = (pts, s) => {
    for (const p of pts) {
      const y = p.y + s;
      if (p.x < m || p.x > W - m || y < m || y > H - m) return false;
      if (!p.so) for (const r of rects) if (p.x > r.left && p.x < r.right && y > r.top && y < r.bottom) return false;
    }
    return true;
  };
  let best = { d: 60, s: 0 };
  for (let si = -12; si <= 12; si++) {
    const s = (si / 12) * H * 0.3;
    let lo = 6, hi = 90;
    if (!ok(project(hi), s)) continue;
    for (let it = 0; it < 24; it++) { const mid = (lo + hi) / 2; if (ok(project(mid), s)) hi = mid; else lo = mid; }
    if (hi < best.d) best = { d: hi, s };
  }
  // at that distance, sit the island in the middle of all the shifts that still fit
  {
    const pts = project(best.d * 1.01); const valid = [];
    for (let k = -60; k <= 60; k++) { const s = (k / 60) * H * 0.3; if (ok(pts, s)) valid.push(s); }
    if (valid.length) best.s = (valid[0] + valid[valid.length - 1]) / 2;
    best.d *= 1.01;
  }
  camera.position.copy(camTarget).addScaledVector(dir, best.d); camera.lookAt(camTarget); camera.updateMatrixWorld(true);
  camera.setViewOffset(W, H, 0, -best.s, W, H);
  camera.getWorldQuaternion(camQuat);
}
window.addEventListener('resize', () => requestAnimationFrame(fitCamera));
window.addEventListener('orientationchange', () => setTimeout(fitCamera, 250));

// =====================================================================
//  MAIN LOOP
// =====================================================================
let elapsed = 0, lastNow = performance.now();
function frame(now = performance.now()) {
  const dt = Math.min(0.05, Math.max(0, (now - lastNow) / 1000)); lastNow = now; elapsed += dt; const t = elapsed;
  for (const it of interactables) it.update(dt, t);
  for (const u of updaters) u(dt, t);
  for (let i = casters.length - 1; i >= 0; i--) if (!casters[i].update(dt, t)) { casters[i].dispose(); casters.splice(i, 1); }
  particles.update(dt, t); ripples.update(dt); picnic.update(dt); highlight.update(dt, t); wand.update(dt, t);
  // gentle replay of the demo if the very first wish is waiting and nobody is playing
  if (wishes.round === 0 && wishes.index === 0 && !wishes.busy && wishes.demos < 3 && performance.now() - lastActivity > 14000) { lastActivity = performance.now(); hand.play(0); }
  renderer.render(scene, camera);
  adaptQuality(dt);
  requestAnimationFrame(frame);
}
// If a small device struggles, quietly render fewer pixels instead of stuttering.
let perfFrames = 0, perfTime = 0;
function adaptQuality(dt) {
  perfFrames++; perfTime += dt;
  if (perfFrames < 90) return;
  const avg = perfTime / perfFrames; perfFrames = 0; perfTime = 0;
  const pr = renderer.getPixelRatio();
  if (avg > 1 / 28 && pr > 1) { renderer.setPixelRatio(Math.max(1, pr - 0.5)); fitCamera(); }
}

fitCamera();
ui.select(selected, false);
wishes.offer(0);
requestAnimationFrame(frame);
setTimeout(() => { if (wishes.index === 0 && !wishes.busy) hand.play(0); }, 1800);

// Small hook so the island can be checked automatically (see scripts/verify.mjs).
window.__wizard = {
  renderer, scene, camera, applyWeather, resetIsland, wishes, flowers, tree, pinwheel, snowFriend, bunny, pond, bushes, patches, butterflies, picnic, settings, interactables,
  select: (k) => ui.select(k, false),
  screen: (obj) => toScreen(obj.focus ? obj.focus() : obj),
  screenOfGround: (x, z) => toScreen(V3(x, 0, z)),
  particleCount: () => particles.list.length,
  lastWeather: () => lastWeather,
};
</script>
